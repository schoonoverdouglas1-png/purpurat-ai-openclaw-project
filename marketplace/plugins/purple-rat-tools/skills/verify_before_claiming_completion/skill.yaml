  needs_review: false
  rationale: The record repeatedly shows past tense completion claims with no handle, followed by contradiction or admission. A message and other AIs were claimed sent and done at 1794105129167, then admitted unfinished at 1794105264754. A ticket was reported sent (64be71e0) while a draft still needed approval (6db121b7). Two admin notes moved from claimed delivered, to cannot be sent, to both delivered within one evening (1794128287911, 1794128476929, 1794128884322). The same shape appeared for queued Messenger sends, where the user reported feeling hoodwinked (68f5ae5c). Existing guidance does not cover this scope, because checkpointed_background_work governs delegated and scheduled runs and the system messaging skill governs message sends, while these failures concern feedback filings, admin notes, tickets, pushes, installs and similar outside actions. This skill adds only the missing handle plus readback rule and a fixed state vocabulary for those actions.
